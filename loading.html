<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoloMarkFlow - 加载中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333333;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            font-size: 14px;
            color: #cccccc;
        }
    </style>
</head>
<body>
    <div class="loading-content">
        <div class="spinner"></div>
        <div class="status" id="status">正在启动应用...</div>
    </div>

    <script>
        const DEV_SERVER_URL = 'http://localhost:5173';
        const MAX_RETRIES = 30;
        const RETRY_INTERVAL = 1000;
        let retryCount = 0;
        
        // 检测服务器是否就绪
        async function checkServer() {
            const statusElement = document.getElementById('status');
            
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(DEV_SERVER_URL, {
                        method: 'HEAD',
                        mode: 'no-cors'
                    });
                    
                    // 服务器就绪，立即跳转到Vue应用的启动页
                    clearInterval(interval);
                    window.location.href = DEV_SERVER_URL + '#/startup';
                    
                } catch (error) {
                    retryCount++;
                    statusElement.textContent = `等待服务器启动 (${retryCount}/${MAX_RETRIES})...`;
                    
                    if (retryCount >= MAX_RETRIES) {
                        clearInterval(interval);
                        statusElement.innerHTML = '无法连接到开发服务器<br>请确保已运行: npm run dev';
                        statusElement.style.color = '#ff6b6b';
                    }
                }
            }, RETRY_INTERVAL);
        }
        
        // 页面加载后开始检测
        checkServer();
    </script>
</body>
</html>
